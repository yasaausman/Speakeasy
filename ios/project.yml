name: KindlyCall
options:
  bundleIdPrefix: com.kindlycall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  KindlyCall:
    type: application
    platform: iOS
    sources:
      - path: KindlyCall
    # Generated Info.plist (SwiftUI lifecycle — no scene manifest needed). A
    # generated plist lets us declare the NSAppTransportSecurity dict, which a
    # scalar INFOPLIST_KEY_ build setting can't express.
    info:
      path: KindlyCall/Info.plist
      properties:
        UILaunchScreen: {}
        # Voice (Track B): microphone + speech recognition usage strings.
        NSMicrophoneUsageDescription: "KindlyCall uses the microphone so you can speak your request."
        NSSpeechRecognitionUsageDescription: "KindlyCall transcribes your speech to understand what you need."
        # Add to Calendar (write-only) for booked appointments.
        NSCalendarsWriteOnlyAccessUsageDescription: "KindlyCall adds appointments it books to your calendar."
        # Full access to read your free/busy so the agent only asks for open times.
        NSCalendarsFullAccessUsageDescription: "KindlyCall checks your free times so it only requests slots you're available for."
        # Coarse location to find businesses near you ("a dentist near me").
        NSLocationWhenInUseUsageDescription: "KindlyCall uses your location to find nearby businesses to call."
        # Reach the KindlyCall backend running on the Mac over the LAN (device testing).
        NSLocalNetworkUsageDescription: "KindlyCall connects to the KindlyCall backend running on your Mac to place calls."
        # Allow the plain-http LAN call to the Mac's private IP without disabling ATS globally.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlycall.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  KindlyCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KindlyCallTests
    dependencies:
      - target: KindlyCall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
  # A lightweight UI smoke test: the app launches and the Home screen renders its
  # greeting and starter chips. Runs via `xcodebuild test` on a booted simulator.
  KindlyCallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KindlyCallUITests
    dependencies:
      - target: KindlyCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindlycall.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
schemes:
  KindlyCall:
    build:
      targets:
        KindlyCall: all
        KindlyCallUITests: [test]
        KindlyCallTests: [test]
    test:
      targets:
        - KindlyCallUITests
        - KindlyCallTests
    run:
      config: Debug
