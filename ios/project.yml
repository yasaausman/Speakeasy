name: Speakeasy
options:
  bundleIdPrefix: com.speakeasy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Speakeasy:
    type: application
    platform: iOS
    sources:
      - path: Speakeasy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speakeasy.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Voice (Track B): microphone + speech recognition usage strings.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Speakeasy uses the microphone so you can speak your request."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speakeasy transcribes your speech to understand what you need."
        # NOTE(Phase M1): to allow http://localhost backend calls from the simulator,
        # add an NSAppTransportSecurity dict (NSAllowsLocalNetworking) via a real Info.plist.
