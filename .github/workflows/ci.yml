name: CI

# Proof a skeptical judge can reproduce: type-check, the deterministic flow tests,
# and the full plan→run→poll→result smoke — all offline, no keys, no real calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Deterministic flow tests
        run: npm test
      - name: End-to-end smoke (fake CALL-E, no keys)
        run: npm run smoke:fake
